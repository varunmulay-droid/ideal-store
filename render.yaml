services:
  - type: web
    name: mitalli-bridal-world
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker backend.app.main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mitalli-bridal-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: BUSINESS_PHONE
        value: "07383099084"
      - key: WHATSAPP_NUMBER
        value: "917383099084"

databases:
  - name: mitalli-bridal-db
    plan: free
    region: oregon
    databaseName: mitalli
    user: mitalli